<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Destination Notice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #f8fafc; /* Clean, light enterprise background */
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .shield-icon {
            width: 56px;
            height: 56px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 26px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .destination-url {
            font-size: 0.9rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-all;
            margin-bottom: 24px;
            border: 1px solid #cbd5e1;
            font-family: monospace;
        }

        p {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .redirect-status {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .countdown {
            font-weight: 600;
            color: #2563eb;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 0.95rem;
            text-decoration: none;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            border: 1px solid #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            color: #0f172a;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="shield-icon">🛡️</div>
        <h1>Leaving Safe Partner Network</h1>
        <p>You are now being redirected to an external verified advertiser page. Please review the destination link below:</p>
        
        <div id="destination-display" class="destination-url">https://nexorawebsite.com.ng</div>

        <div class="redirect-status">
            Redirecting automatically in <span id="timer" class="countdown">6</span>s...
        </div>

        <div class="btn-group">
            <a id="destination-link" href="https://nexorawebsite.com.ng" class="btn btn-primary">Proceed Now</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>

        <div class="footer-note">
            Ad Verification Gateway • Secure Tracking ID: #TRK-98214
        </div>
    </div>

    <script>
        // Target URL configuration
        const targetURL = "https://nexorawebsite.com.ng";
        
        // Update DOM elements safely
        document.getElementById('destination-link').href = targetURL;
        document.getElementById('destination-display').textContent = targetURL;

        let timeLeft = 6;
        const timerElement = document.getElementById('timer');

        // Countdown timer loop
        const countdownInterval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.replace(targetURL); // Using replace to avoid back-button loops to this page
            }
        }, 1000);
    </script>
</body>
</html>
